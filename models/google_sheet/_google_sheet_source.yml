version: 2

sources:
  - name: google_sheets # name of the source 
    schema: schema_bronze_google # this is the schema our raw data lives in
    database: DB13_BRONZE_DB # this is the name of our database quoting:

    quoting:
      database: false
      schema: false
      identifier: false 
    
    config:  
      freshness:
        warn_after: {count: 24, period: hour}
        error_after: {count: 48, period: hour} 
    
    tables:
      
      - name: budget 
        config:
          loaded_at_field: _fivetran_synced 
        columns:
          - name: _row
          - name: product_id
          - name: quantity
          - name: month
          - name: _fivetran_synced

      - name: db_users
        columns:
          - name: Nombre
          - name: DNI
          - name: email
          - name: fecha_alta_sistema